<section id="profile-picker" class="household-profile-picker"%HIDDEN% aria-labelledby="profile-picker-heading"><div class="profile-picker-content"><span class="home-eyebrow">%EYEBROW%</span><h1 id="profile-picker-heading">%HEADING%</h1><p id="profile-picker-description" class="muted">Choose your profile to make yourself at home.</p><div id="profile-picker-grid" class="profile-picker-grid"></div><p id="profile-picker-status" role="status" aria-live="polite"></p><div class="profile-picker-footer"><button id="picker-sign-out" type="button">Sign out of household</button>%ACTIONS%</div><button id="picker-device-back" class="quiet" type="button" hidden>Back to profiles</button></div></section><dialog id="add-profile-dialog" class="profile-pin-dialog" aria-labelledby="add-profile-heading"><h2 id="add-profile-heading">Add a profile</h2><form id="picker-add-profile-form"><div class="person-name-fields"><label>Voornaam<input name="first_name" autocomplete="given-name" maxlength="100" required></label><label>Tussenvoegsel <input name="name_prefix" autocomplete="off" maxlength="50"></label><label>Achternaam<input name="last_name" autocomplete="family-name" maxlength="100" required></label></div><p class="muted">Only an administrator can add profiles. Choose an administrator to approve this change.</p><label>Administrator profile<select name="administrator" required></select></label><label id="add-profile-pin-field" hidden>Administrator profile PIN<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" autocomplete="off"></label><p id="add-profile-error" role="status" aria-live="polite"></p><div class="profile-pin-buttons"><button id="add-profile-cancel" type="button">Cancel</button><button type="submit" class="primary">Add profile</button></div></form></dialog>
<dialog id="profile-pin-dialog" class="profile-pin-dialog" aria-labelledby="profile-pin-heading"><h2 id="profile-pin-heading">Enter profile PIN</h2><form id="profile-pin-form"><label><span id="profile-pin-label">Profile PIN</span><input id="profile-pin-input" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" autocomplete="off" required></label><p id="profile-pin-error" role="status" aria-live="polite"></p><div class="profile-pin-buttons"><button id="profile-pin-cancel" type="button">Cancel</button><button type="submit" class="primary">Open profile</button></div></form></dialog>
